name = "xhipa-storefront-saas"
main = "worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Static Assets Configuration for React SPA
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Cloudflare R2 Bucket Binding for high-performance media storage
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "xhipa"
preview_bucket_name = "xhipa-preview"

[vars]
ENVIRONMENT = "production"
APP_URL = "https://xhipa.com"

# Sensitive variables to be set via `wrangler secret put <KEY>`:
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - SUPABASE_ANON_KEY
# - PAYSTACK_SECRET_KEY
# - PAYSTACK_PUBLIC_KEY

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
