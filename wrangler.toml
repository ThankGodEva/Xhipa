name = "xhipa-storefront-saas"
main = "worker.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare R2 Bucket Binding for high-performance media storage
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "xhipa-storefront-media"
preview_bucket_name = "xhipa-storefront-media-preview"

[vars]
ENVIRONMENT = "production"
APP_URL = "https://xhipa.com"

# Sensitive variables to be set via `wrangler secret put <KEY>`:
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - SUPABASE_ANON_KEY
# - PAYSTACK_SECRET_KEY
# - PAYSTACK_PUBLIC_KEY

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
